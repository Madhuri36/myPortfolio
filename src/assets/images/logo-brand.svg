<svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer diamond contour -->
  <polygon points="50,6 94,50 50,94 6,50" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.3" fill="none" />
  <polygon points="50,14 86,50 50,86 14,50" stroke="url(#cyberGrad)" stroke-width="2.5" fill="#05050a" fill-opacity="0.9" />

  <!-- Monogram S & M intertwining geometry -->
  <!-- S-curve -->
  <path d="M42 36 C42 31, 32 31, 32 38 C32 46, 48 44, 48 54 C48 61, 36 61, 34 56" 
        stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)" />
  
  <!-- M-structure -->
  <path d="M52 58 L52 36 L62 48 L72 36 L72 58" 
        stroke="url(#cyberGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Accent vertex dots -->
  <circle cx="50" cy="14" r="2.5" fill="#00d4ff" />
  <circle cx="50" cy="86" r="2.5" fill="#00d4ff" />
  <circle cx="14" cy="50" r="2.5" fill="#0066ff" />
  <circle cx="86" cy="50" r="2.5" fill="#00d4ff" />
</svg>
